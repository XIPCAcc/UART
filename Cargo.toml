[package]
name = "uart-matmul"
version = "0.1.0"
edition = "2021"

[dependencies]
serialport = { version = "4", default-features = false }
nalgebra = "0.33"
clap = { version = "4", features = ["derive"] }
signal-hook = "0.3"
log = "0.4"
env_logger = "0.11"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
